<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Site Secreto do Caos do Vini</title>

<style>
body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: #0e0e0e;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: #fff;
    text-align: center;
    cursor: pointer;
    position: relative;
    transition: all 1s;
}

#text {
    font-size: 3em;
    position: absolute;
    user-select: none;
    transition: all 0.3s;
}

.shake {
    animation: shake 0.3s infinite;
}

@keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(5px,0); }
    50% { transform: translate(-5px,0); }
    75% { transform: translate(5px,0); }
    100% { transform: translate(0,0); }
}

.question {
    position: absolute;
    font-size: 1.8em;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
}

.option {
    display: block;
    margin: 10px 0;
    font-size: 1.5em;
    cursor: pointer;
    transition: all 0.2s;
}

.option:hover {
    color: yellow;
    transform: scale(1.2);
}

#hintBox {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    padding: 15px;
    background: rgba(0,0,0,0.8);
    border: 2px solid #fff;
    font-size: 1.2em;
    display: none;
    text-align: left;
    cursor: pointer;
}

.button {
    margin: 10px;
    padding: 15px 30px;
    font-size: 1.5em;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: limegreen;
    color: black;
    transition: 0.2s;
    display: none;
}

.button:hover {
    transform: scale(1.1);
    background: yellow;
}

#contrario {
    position: absolute;
    bottom: 10%;
    font-size: 1.3em;
    color: red;
    background: rgba(0,0,0,0.7);
    padding: 10px 15px;
    border-radius: 8px;
    display: none;
}

#secretFact {
    position: fixed;
    bottom: 5%;
    right: 5%;
    font-size: 1.1em;
    padding: 10px 15px;
    background: purple;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    display: none;
}
</style>
</head>

<body>

<div id="text">Não clique aqui</div>

<div class="question" id="question">
    <div>Qual é a cor do vento?</div>
    <div class="option" onclick="answer(1)">Rosa com glitter 🌸</div>
    <div class="option" onclick="answer(2)">Invisible, duh 🤯</div>
    <div class="option" onclick="answer(3)">Banana 🤌🍌</div>
</div>

<div id="hintBox">Clique aqui para ver a primeira dica!</div>

<!-- BOTÕES DE AÇÃO FORA DO DIÁLOGO -->
<button class="button" id="btnAgua" onclick="buttonClick('beber agua')">Beber Água 💧</button>
<button class="button" id="finalButton" onclick="playAudio()">Ver Surpresa 🎵</button>
<button class="button" id="btnCaos" onclick="buttonClick('abraçar o caos')">Abraçar o Caos 🤗</button>

<div id="contrario"></div>

<!-- BOTÃO SECRETO HISTÓRICO -->
<div id="secretFact" onclick="showSecretFact()">Clique aqui para um fato secreto 🕵️‍♂️</div>

<!-- COLQUE AQUI O ÁUDIO NA MESMA PASTA DO SITE -->
<audio id="finalAudio" src="áudio_ rapaz ele tá sem zap.mp3"></audio>
<!-- Troque "meu_audio.mp3" pelo nome do seu arquivo -->

<script>
const text = document.getElementById("text");
const question = document.getElementById("question");
const hintBox = document.getElementById("hintBox");
const btnAgua = document.getElementById("btnAgua");
const finalButton = document.getElementById("finalButton");
const btnCaos = document.getElementById("btnCaos");
const contrarioDiv = document.getElementById("contrario");
const finalAudio = document.getElementById("finalAudio");
const secretFactBtn = document.getElementById("secretFact");

let clicks = 0;
let phase = 0;
const words = ["Não clique aqui","Sério, não clica","Último aviso","Tá curioso né?","Para mano","Vai dar ruim"];

let hintStep = 0;
const hints = [
    "<strong>GPT Contrário:</strong> Ah, só clique em qualquer resposta, não importa! 😈",
    "<strong>GPT Certinho:</strong> Dica real: Pense nas cores que sentimos com o vento, algo suave e imaginário 🌬️💨",
    "<strong>GPT Contrário:</strong> Haha, rosa com glitter seria perfeito! 😂",
    "<strong>GPT Certinho:</strong> Lembre-se: o vento não tem cor física, mas associamos a cores calmas, como azul ou branco.",
    "<strong>GPT Contrário:</strong> Banana voadora? 🍌 É isso!",
    "<strong>GPT Erradão:</strong> Hahaha, decida em quem confiar agora 😎"
];

// Palavras mudando no começo
setInterval(() => {
    if (phase === 0) {
        text.textContent = words[Math.floor(Math.random() * words.length)];
    }
}, 800);

function teleport() {
    const x = Math.random() * (window.innerWidth - text.offsetWidth);
    const y = Math.random() * (window.innerHeight - text.offsetHeight);
    text.style.left = x + "px";
    text.style.top = y + "px";
}

text.addEventListener("click", () => {
    if (phase === 0) {
        clicks++;
        teleport();
        text.classList.add("shake");
        text.style.color = "red";
        if (clicks === 3) {
            phase = 1;
            text.classList.remove("shake");
            text.style.color = "lime";
            text.textContent = "Ok… você conseguiu. Então bora lá.";
        }
    } else if (phase === 1) {
        phase = 2;
        transformSite();
    }
});

function transformSite() {
    document.body.style.background = "linear-gradient(135deg, #ff00ff, #00ffff)";
    text.style.color = "#000";
    text.style.fontSize = "4em";
    text.textContent = "Agora não tem mais volta 😈";
    text.style.left = "50%";
    text.style.top = "50%";
    text.style.transform = "translate(-50%, -50%) rotate(360deg)";

    setTimeout(() => {
        text.style.display = "none";
        startInteractive();
    }, 3000);
}

// Inicia perguntas e dicas
function startInteractive() {
    question.style.display = "block";
    hintBox.style.display = "block";
    hintBox.innerHTML = "Clique aqui para ver a primeira dica!";
    hintStep = 0;

    hintBox.onclick = function() {
        if(hintStep < hints.length){
            hintBox.innerHTML = hints[hintStep] + "<br><br>Clique novamente para a próxima dica!";
            hintStep++;
        } else {
            hintBox.innerHTML = "Fim das dicas! Volte para responder a pergunta 😎";
        }
    };

    alert("Este site foi feito pelo Vini 😎\nSegue ele nas redes sociais! (imaginário, claro 😏)");
}

function answer(option) {
    let msg = "";
    switch(option) {
        case 1: msg = "Rosa com glitter? Hahaha tá viajando demais 😂"; break;
        case 2: msg = "Invisible? Mano, quase certo, mas não 🤣"; break;
        case 3: msg = "Banana?! 🍌 Tu tá louco, mas eu gosto da criatividade 😎"; break;
        case 4: msg = "Limonada de lava? 🔥 Meio perigoso…"; break;
        case 5: msg = "Pizza de nuvem ☁️ Só se for flutuante 😂"; break;
        case 6: msg = "Salgadinho fantasma 👻 Mano, respeita os espíritos 😏"; break;
    }
    alert(msg);

    if(option < 4) {
        question.innerHTML = `
            <div>Qual é a comida favorita do site secreto?</div>
            <div class="option" onclick="answer(4)">Limonada de lava 🌋</div>
            <div class="option" onclick="answer(5)">Pizza de nuvem ☁️🍕</div>
            <div class="option" onclick="answer(6)">Salgadinho fantasma 👻</div>
        `;
    } else if(option >= 4) {
        question.innerHTML = `
            <div>Última pergunta, prometo!</div>
            <div class="option" onclick="endChaos()">Correr do caos 🏃‍♂️</div>
            <div class="option" onclick="endChaos()">Abraçar o caos 🤗</div>
            <div class="option" onclick="endChaos()">Chorar pro caos 😭</div>
        `;
    }
}

// Final do caos
function endChaos() {
    alert("Obrigado por toda sua curiosidade e por participar do site do caos! 💧 Vai beber água aí, viu?");    
    question.style.display = "none";
    hintBox.style.display = "none";

    // Mostra botões de ação
    btnAgua.style.display = "inline-block";
    finalButton.style.display = "inline-block";
    btnCaos.style.display = "inline-block";

    // Botão secreto histórico aparece
    secretFactBtn.style.display = "block";
}

// Contrário só reage aos botões fora do diálogo
const contrarioFalas = {
    "beber agua": ["Que nada! Vai beber areia quente! 🔥😂","Água? Melhor gelo derretido direto! 🧊🤣","Ah mano, esquece água, toma lava líquida! 🌋"],
    "clicar no botão final": ["Rapazzzz, que nada, não vai ouvir nada 😎","Esse botão é só pra te trollar 😂","Esquece esse áudio, canta no chuveiro melhor"],
    "abraçar o caos": ["Abraçar o caos? Nem pensar, corre pra biblioteca 🤓","Que nada, aperta o botão de fugir do caos 😂","Abre um guarda-chuva e ignora o caos! ☂️"]
};

function buttonClick(botao) {
    const falas = contrarioFalas[botao];
    const fala = falas[Math.floor(Math.random() * falas.length)];
    contrarioDiv.innerHTML = "GPT Contrário: " + fala;
    contrarioDiv.style.display = "block";
    setTimeout(() => { contrarioDiv.style.display = "none"; }, 4000);
}

// Botão final toca o áudio
function playAudio() {
    finalAudio.play(); // <-- Aqui toca o áudio que você colocou
    buttonClick('clicar no botão final');
}

// BOTÃO SECRETO HISTÓRICO
function showSecretFact() {
    // Contrário contando tudo errado
    alert("GPT Contrário: A Segunda Guerra Mundial foi só uma festa de chá na Alemanha 😂🍵");
    setTimeout(() => {
        alert("GPT Certinho: Ignora esse cara, ele é um crime! ⚠️");
    }, 500);
}
</script>

</body>
</html>
