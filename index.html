<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Hakari Jackpot APOCALIPSE 🎰</title>

<style>
body {
    background: radial-gradient(circle, #1a001f, #000);
    color: white;
    font-family: Arial;
    text-align: center;
    overflow: hidden;
}

/* TREMER */
.shake { animation: shake 0.1s infinite; }
@keyframes shake {
    0%{transform:translate(2px,2px);}
    50%{transform:translate(-2px,-2px);}
    100%{transform:translate(2px,-2px);}
}

/* SLOT */
.slot {
    font-size: 60px;
    width: 90px;
    height: 90px;
    display: inline-block;
    line-height: 90px;
    border: 2px solid white;
    margin: 5px;
    border-radius: 10px;
    background: #222;
}

/* NEON */
.neon-win { animation: neonWin 0.5s infinite alternate; }
@keyframes neonWin {
    from { box-shadow: 0 0 10px cyan; }
    to { box-shadow: 0 0 25px magenta; }
}

.neon-insane { animation: neonInsane 0.2s infinite; }
@keyframes neonInsane {
    0% { box-shadow: 0 0 15px purple; }
    33% { box-shadow: 0 0 20px lime; }
    66% { box-shadow: 0 0 25px hotpink; }
}

/* ALAVANCA */
.lever-container {
    width: 80px;
    height: 150px;
    margin: 20px auto;
    position: relative;
}
.lever-arm {
    width: 8px;
    height: 110px;
    background: silver;
    position: absolute;
    left: 36px;
    top: 0;
    transform-origin: top center;
    transition: transform 0.25s;
}
.knob {
    width: 24px;
    height: 24px;
    background: red;
    border-radius: 50%;
    position: absolute;
    bottom: -12px;
    left: -8px;
}
.lever-base {
    width: 30px;
    height: 10px;
    background: #555;
    position: absolute;
    bottom: 0;
    left: 25px;
}

/* TEXTO */
.big-text {
    position: fixed;
    top: 40%;
    width: 100%;
    font-size: 40px;
    font-weight: bold;
    text-shadow: 0 0 20px white;
}

/* FRASES */
#taunt {
    margin-top: 10px;
    font-size: 16px;
    color: #ccc;
    height: 20px;
}

/* 777 VOANDO */
.fly777 {
    position: fixed;
    font-size: 28px;
    font-weight: bold;
    animation: neonText 0.3s infinite alternate;
}
@keyframes neonText {
    0% { color: purple; }
    33% { color: lime; }
    66% { color: hotpink; }
}

/* BOTÃO */
.secret {
    position: fixed;
    bottom: 8px;
    right: 8px;
    font-size: 18px;
    opacity: 0.3;
    cursor: pointer;
}

</style>
</head>

<body>

<h1>🎰 HAKARI JACKPOT APOCALIPSE 🎰</h1>

<div>
    <div class="slot" id="s1">❓</div>
    <div class="slot" id="s2">❓</div>
    <div class="slot" id="s3">❓</div>
</div>

<div class="lever-container">
    <div class="lever-arm" id="lever">
        <div class="knob"></div>
    </div>
    <div class="lever-base"></div>
</div>

<p>Clique na alavanca</p>

<input type="file" id="musicInput" accept="audio/*">
<p style="font-size:12px;">coloque aqui a musica que deseja ouvir quando fizer jackpot 777</p>

<div id="result">A sorte decide...</div>
<div id="taunt"></div>

<audio id="winMusic"></audio>

<div class="secret" onclick="force777()">🍀</div>

<script>
const lever = document.getElementById("lever");
const audio = document.getElementById("winMusic");
const slots = document.querySelectorAll(".slot");

let spinning = false;
let tauntInterval;

// FRASES
const taunts = [
"isso... continua tentando 😈",
"quase kkkkk (mentira)",
"o cassino agradece 💀",
"mais uma tentativa inútil",
"vc acha que vai ganhar?",
"hakari tá rindo de vc agora"
];

const winTaunts = [
"ok… isso foi inesperado 😳",
"não acredito que vc conseguiu",
"foi sorte… pura sorte"
];

const insaneTaunts = [
"HAHAHAHAHAHA",
"ENERGIA INFINITA",
"QUEBROU TUDO",
"VOCÊ NÃO DEVERIA TER CONSEGUIDO",
"O SISTEMA CAIU"
];

// MUSICA
musicInput.onchange = e => {
    let f = e.target.files[0];
    if (f) audio.src = URL.createObjectURL(f);
};

// ALAVANCA
lever.onclick = () => {
    if (spinning) return;

    lever.style.transform = "rotate(65deg)";
    setTimeout(()=> lever.style.transform="rotate(0deg)",250);

    spin();
};

function randomSymbol(){
    let r=Math.random();
    if(r<0.02)return "7";
    if(r<0.3)return "💀";
    if(r<0.5)return "🔥";
    if(r<0.7)return "⚡";
    if(r<0.85)return "💎";
    return "🍀";
}

function spin(){
    spinning=true;
    startTaunts();

    let spins=20;
    let i=setInterval(()=>{
        s1.innerHTML=randomSymbol();
        s2.innerHTML=randomSymbol();
        s3.innerHTML=randomSymbol();
        spins--;

        if(spins<=0){
            clearInterval(i);
            stopTaunts();
            checkWin();
            spinning=false;
        }
    },70);
}

function startTaunts(){
    tauntInterval=setInterval(()=>{
        taunt.innerText=taunts[Math.floor(Math.random()*taunts.length)];
    },800);
}

function stopTaunts(){
    clearInterval(tauntInterval);
}

function checkWin(){
    let a=s1.innerHTML,b=s2.innerHTML,c=s3.innerHTML;

    if(a==="7"&&b==="7"&&c==="7")insaneJackpot();
    else if(a===b&&b===c)normalJackpot();
    else{
        result.innerHTML="💀 perdeu...";
        taunt.innerText="kkkkk perdeu de novo";
    }
}

function normalJackpot(){
    result.innerHTML="✨ JACKPOT ✨";
    taunt.innerText=winTaunts[Math.floor(Math.random()*winTaunts.length)];

    slots.forEach(s=>s.classList.add("neon-win"));
    setTimeout(()=>slots.forEach(s=>s.classList.remove("neon-win")),2000);

    if(audio.src)audio.play();
}

function insaneJackpot(){
    result.innerHTML="💜 777 APOCALIPSE 💜";

    document.body.classList.add("shake");
    slots.forEach(s=>s.classList.add("neon-insane"));

    let text=document.createElement("div");
    text.className="big-text";
    text.innerText="Great gain of infinite energy for 4 minutes";
    document.body.appendChild(text);

    let spam=setInterval(()=>{
        taunt.innerText=insaneTaunts[Math.floor(Math.random()*insaneTaunts.length)];
    },200);

    let spawn=setInterval(()=>{
        let el=document.createElement("div");
        el.className="fly777";
        el.innerText="777";
        el.style.left=Math.random()*100+"vw";
        el.style.top=Math.random()*100+"vh";

        let angle=Math.random()*360;
        let dist=200+Math.random()*300;

        el.animate([
            {transform:"translate(0,0)"},
            {transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`}
        ],{duration:1000});

        document.body.appendChild(el);
        setTimeout(()=>el.remove(),2000);

    },80);

    setTimeout(()=>{
        clearInterval(spawn);
        clearInterval(spam);
        document.body.classList.remove("shake");
        slots.forEach(s=>s.classList.remove("neon-insane"));
        text.remove();
    },131000);

    if(audio.src)audio.play();
}

// BOTÃO
function force777(){
    if(spinning)return;
    s1.innerHTML="7";
    s2.innerHTML="7";
    s3.innerHTML="7";
    insaneJackpot();
}
</script>

</body>
</html>
